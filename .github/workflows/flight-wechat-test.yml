name: ServerChan WeChat Push Test

on:
  workflow_dispatch:
  push:
    paths:
      - "flight-watch/wechat-test-trigger.json"

permissions:
  contents: read

jobs:
  test-wechat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Test one ServerChan notification (no airfare API)
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python3 scripts/serverchan_push.py

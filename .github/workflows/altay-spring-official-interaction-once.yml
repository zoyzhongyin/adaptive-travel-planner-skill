name: Altay Spring official visible booking interaction once
on:
  push:
    branches: [flight-source-probe-20261030]
    paths:
      - .github/workflows/altay-spring-official-interaction-once.yml
      - flight-watch/probes/probe_spring_booking_interaction.py
permissions:
  contents: read
jobs:
  spring-booking:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install temporary browser
        run: |
          python -m pip install --quiet "playwright>=1.50,<1.60"
          python -m playwright install chromium --with-deps
      - name: Try Spring public flight booking UI (no purchase)
        run: python flight-watch/probes/probe_spring_booking_interaction.py

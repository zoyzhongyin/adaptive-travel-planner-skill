name: Altay additional independent source CNY proof
on:
  push:
    branches: [flight-source-probe-20261030]
    paths:
      - .github/workflows/altay-next-source-cny-one-off.yml
permissions:
  contents: read
jobs:
  official-calendar:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Probe public China Southern price calendar once
        run: python3 flight-watch/probes/probe_next_independent_cny.py csair
  google-cny:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install open source Google Flights library, no private credentials
        run: python -m pip install --quiet flights
      - name: Test exact TFU/AAT dates, currency explicitly CNY
        run: python flight-watch/probes/probe_next_independent_cny.py google

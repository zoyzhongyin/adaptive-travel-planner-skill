name: One-time six-pair Tongcheng supplement integration proof

on:
  push:
    paths:
      - ".github/workflows/probe-tongcheng-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/experiment/altay-multisource-probe-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up normal public browser
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.56.0'
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            python3 -m playwright install chromium
          fi
      - name: Generate six-pair supplemental snapshot, no WeChat or state writes
        run: python3 scripts/tongcheng_snapshot.py
      - name: Validate read-only public snapshot construction and Worker tests
        run: |
          python3 scripts/build_fare_dashboard.py
          node --test flight-watch/cloudflare-dispatch/worker.test.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("flight-watch/tongcheng-latest.json").read_text())
          assert len(data["itineraries"])==6
          assert data["bookability_verified"] is False
          assert data["cabin_verified"] is False
          assert data["taxes_verified"] is False
          assert data["baggage_verified"] is False
          pub=Path("flight-watch/cloudflare-dispatch/dashboard-data.mjs").read_text()
          obj=json.loads(pub.split(" = ",1)[1].rstrip(";\n"))
          assert any(x.get("alternate") and x["alternate"].get("source")=="同程公开页面"
                     for x in obj["itineraries"])
          assert "GH_ACTIONS_TOKEN" not in pub
          print("Six-pair safe snapshot and public read-only Worker tests passed.")
          PY

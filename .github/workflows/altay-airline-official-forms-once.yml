name: Altay official airline public booking form verification
on:
  push:
    branches: [flight-source-probe-20261030]
    paths:
      - .github/workflows/altay-airline-official-forms-once.yml
permissions:
  contents: read
jobs:
  official-forms:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        airline: [spring, sichuan, airchina]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install temporary Chromium
        run: |
          python -m pip install --quiet "playwright>=1.50,<1.60"
          python -m playwright install chromium --with-deps
      - name: Inspect official public booking controls (no request submission)
        run: python flight-watch/probes/probe_airline_official_forms.py --airline ${{ matrix.airline }}

name: One-time Tongcheng Chromium data extraction proof

on:
  push:
    paths:
      - ".github/workflows/probe-tongcheng-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/experiment/altay-multisource-probe-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install local browser automation, no provider API key
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.56.0'
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            python3 -m playwright install chromium
          fi
      - name: Validate two public pages in read-only Chromium
        run: python3 scripts/probe_tongcheng_browser.py

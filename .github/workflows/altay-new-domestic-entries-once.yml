name: Altay new domestic independent platform entry probe
on:
  push:
    branches: [flight-source-probe-20261030]
    paths:
      - .github/workflows/altay-new-domestic-entries-once.yml
permissions:
  contents: read
jobs:
  entry-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install temporary Chromium
        run: |
          python -m pip install --quiet 'playwright==1.56.0'
          python -m playwright install chromium --with-deps
      - name: Verify public entrypoints without login, payment or bypass
        run: python flight-watch/probes/probe_domestic_new_platforms.py

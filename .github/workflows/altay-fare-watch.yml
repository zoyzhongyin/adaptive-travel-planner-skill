name: Altay Fare Watch (adaptive)
run-name: "Altay fares · ${{ github.event_name }} · ${{ inputs.trigger_source || 'github' }}"

on:
  schedule:
    # Backup only. Cloudflare cron stays at 7,22,37,52 and is the 15-minute trigger.
    # Offset minutes so a healthy Cloudflare dispatch and this backup do not queue together.
    - cron: "14,44 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use simulated prices for a no-alert functional test"
        type: boolean
        default: false
      force_scan:
        description: "One-off live verification: bypass the per-pair scan cooldown"
        type: boolean
        default: false
      trigger_source:
        description: "Diagnostic source label (not an authentication claim)"
        type: choice
        options: [manual, cloudflare]
        default: manual

permissions:
  contents: write

concurrency:
  group: altay-fare-watch
  cancel-in-progress: false

jobs:
  fare-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Record trigger
        env:
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ inputs.trigger_source || 'github' }}
        run: |
          echo "Trigger: $EVENT / $SOURCE; run $GITHUB_RUN_ID. A green job is not by itself a valid fare." >> "$GITHUB_STEP_SUMMARY"
      - name: See whether any itinerary is due
        id: due
        if: inputs.dry_run != true
        env:
          FORCE_SCAN: ${{ inputs.force_scan }}
        run: python3 scripts/flight_watch_batch.py --select-only
      - name: Set up Node.js 22
        if: steps.due.outputs.due == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FlyAI CLI
        if: steps.due.outputs.due == 'true'
        run: npm install -g @fly-ai/flyai-cli@1.0.16 --no-audit --no-fund
      - name: Check overdue itineraries (oldest first, max 3 per run)
        id: price_watch
        if: inputs.dry_run == true || steps.due.outputs.due == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLYAI_API_KEY: ${{ secrets.FLYAI_API_KEY }}
          FORCE_SCAN: ${{ inputs.force_scan }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            python3 scripts/flight_price_watch.py --test
          else
            python3 scripts/flight_watch_batch.py
          fi
      - name: Save diagnostic output
        if: always() && (steps.due.outputs.due == 'true' || inputs.dry_run == true)
        uses: actions/upload-artifact@v4
        with:
          name: flight-watch-check
          path: fare-results/
          if-no-files-found: ignore
          retention-days: 5
      - name: Flag a price alert for GitHub notification
        if: steps.price_watch.outputs.price_alert == 'true'
        run: |
          echo "::error title=阿勒泰机票候选价已达标::请打开本次工作流 Summary。报价是参考价，税费、行李和雪具均未核实。"
          echo "This job intentionally fails ONLY on a NEW deal when WeChat delivery did not succeed; configure GitHub Actions failure notifications."
          exit 1
      - name: Flag a monitor anomaly for GitHub notification
        if: steps.price_watch.outputs.anomaly_alert == 'true'
        run: |
          echo "::error title=阿勒泰机票监控异常::连续没有拿到有效往返参考价。这是数据缺口，不是没有航班，也不是价格高于预算。"
          echo "GitHub email is the backup channel because ServerChan delivery did not succeed."
          exit 1

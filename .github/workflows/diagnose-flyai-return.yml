name: Diagnose FlyAI Return Leg (one-time)

on:
  push:
    paths:
      - ".github/workflows/diagnose-flyai-return.yml"
      - "scripts/diagnose_flyai_return.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FlyAI CLI
        run: npm install -g @fly-ai/flyai-cli@1.0.16 --no-audit --no-fund
      - name: Compare safe return flight query forms
        env:
          FLYAI_API_KEY: ${{ secrets.FLYAI_API_KEY }}
        run: python3 scripts/diagnose_flyai_return.py

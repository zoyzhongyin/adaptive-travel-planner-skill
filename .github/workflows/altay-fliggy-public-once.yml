name: Altay Fliggy public fare one-off probe
on:
  push:
    branches: [flight-source-probe-20261030]
    paths:
      - .github/workflows/altay-fliggy-public-once.yml
      - flight-watch/probes/probe_fliggy_public.py
permissions:
  contents: read
jobs:
  public-fliggy:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install temporary Chromium
        run: |
          python -m pip install --quiet "playwright>=1.50,<1.60"
          python -m playwright install chromium --with-deps
      - name: Fetch reference parser without running it as a server
        run: |
          git clone --depth 1 https://github.com/LLL151/ticket.git /tmp/ticket
          python -m pip install --quiet -r /tmp/ticket/requirements.txt
      - name: Query one exact December five-night return pair
        run: python flight-watch/probes/probe_fliggy_public.py

name: Meituan actual flight-listing standalone diagnostic
on:
  push:
    branches: [flight-source-probe-20261030]
    paths:
      - .github/workflows/altay-meituan-list-once.yml
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install ordinary mobile browser
        run: |
          python -m pip install --quiet 'playwright==1.56.0'
          python -m playwright install chromium --with-deps
      - name: Check actual Meituan listings for three exact days
        run: python flight-watch/probes/probe_meituan_listing.py

name: Verify FlyAI Key and Altay Fares

on:
  push:
    paths:
      - ".github/workflows/verify-flyai-secret.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fares:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify FlyAI secret is present (without revealing its value)
        env:
          FLYAI_API_KEY: ${{ secrets.FLYAI_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$FLYAI_API_KEY" ]]; then
            echo "::error title=FlyAI secret missing::GitHub Actions secret FLYAI_API_KEY is not available"
            exit 1
          fi
          echo "FLYAI_API_KEY present, checking whether the API honors it"
      - name: Install FlyAI CLI
        run: npm install -g @fly-ai/flyai-cli@1.0.16 --no-audit --no-fund
      - name: Verify real reference fares and six monitored legs
        env:
          FLYAI_API_KEY: ${{ secrets.FLYAI_API_KEY }}
        shell: bash
        run: python3 scripts/verify_flyai_new_key.py
      - name: Upload sanitized diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-flyai-key-check
          path: fare-results/safe-key-check.json
          if-no-files-found: ignore
          retention-days: 3

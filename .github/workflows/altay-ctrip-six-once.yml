name: Altay six itinerary Ctrip one-off verification
on:
  push:
    branches: [flight-source-probe-20261030]
    paths:
      - .github/workflows/altay-ctrip-six-once.yml
permissions:
  contents: read
jobs:
  ctrip-all-six:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Prepare temporary Chromium browser
        run: |
          python -m pip install --quiet "playwright>=1.50,<1.60"
          python -m playwright install chromium --with-deps
      - name: Fetch public reference implementation
        run: git clone --depth 1 https://github.com/Yybrook/ctrip-ticket-crawler.git /tmp/ctrip-ticket-crawler
      - name: Query all 12 legs once, print only validated fare summaries
        run: python flight-watch/probes/probe_six_ctrip.py

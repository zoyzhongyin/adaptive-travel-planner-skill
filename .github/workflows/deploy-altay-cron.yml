name: Deploy existing Altay Cloudflare scheduler

on:
  push:
    paths:
      - ".github/workflows/deploy-altay-cron.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-altay-fare-cron
  cancel-in-progress: false

jobs:
  deploy-existing-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Diagnose Cloudflare authorization wiring without revealing values
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          print("Cloudflare account ID: " + ("present / valid 32-hex format" if re.fullmatch(r"[0-9a-fA-F]{32}",account) else "MISSING OR INVALID FORMAT"))
          print("Cloudflare API token: " + ("PRESENT" if token else "MISSING"))
          print("Credentials values are intentionally not printed.")
          PY
      - name: Require existing Worker and GitHub dispatch secret
        run: python3 flight-watch/cloudflare-dispatch/check-existing.py
      - name: Build safe dashboard snapshot from latest private state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_fare_dashboard.py --github
      - name: Test scheduler offline
        run: node --test flight-watch/cloudflare-dispatch/worker.test.mjs
      - name: Deploy to existing altay-fare-cron
        working-directory: flight-watch/cloudflare-dispatch
        run: npx --yes wrangler@4.151.3 deploy --keep-vars
      - name: Deployment verification instructions
        run: |
          echo 'Existing Worker updated. Cron: 7,22,37,52 UTC. Wait for dispatch_accepted HTTP 204 in Cloudflare logs, then match the cloudflare-labelled Actions run. Deployment alone does not validate the GitHub token.' >> "$GITHUB_STEP_SUMMARY"

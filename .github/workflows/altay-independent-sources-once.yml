name: Altay independent fare sources one-off probe

on:
  push:
    branches: [flight-source-probe-20261030]
    paths:
      - .github/workflows/altay-independent-sources-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-ctrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium in temporary runner
        run: |
          python -m pip install --quiet "playwright>=1.50,<1.60"
          python -m playwright install chromium --with-deps
      - name: Clone candidate repository only
        run: git clone --depth 1 https://github.com/Yybrook/ctrip-ticket-crawler.git /tmp/ctrip-ticket-crawler
      - name: Query two exact TFU-AAT flight legs on public website
        run: python flight-watch/probes/probe_two_date_sources.py --source ctrip

  independent-flyclaw-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Fetch candidate and only its documented price-source dependencies
        run: |
          git clone --depth 1 https://github.com/AI4MSE/FlyClaw.git /tmp/FlyClaw
          python -m pip install --quiet -r /tmp/FlyClaw/requirements.txt
      - name: Query Google Flights and Skiplagged independently (no FlyAI)
        run: python flight-watch/probes/probe_two_date_sources.py --source flyclaw

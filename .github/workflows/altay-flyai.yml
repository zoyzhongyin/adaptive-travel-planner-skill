name: Altay Fare Lookup (FlyAI)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/altay-flyai.yml

permissions:
  contents: read

jobs:
  fare-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLYAI_API_KEY: ${{ secrets.FLYAI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official FlyAI CLI
        run: |
          set -euo pipefail
          npm --version
          npm install -g @fly-ai/flyai-cli@1.0.16 --no-audit --no-fund
          command -v flyai
          flyai --help
      - name: Query three six-day round trips
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fare-results
          for dates in 2026-12-08:2026-12-13 2026-12-09:2026-12-14 2026-12-10:2026-12-15; do
            dep="${dates%%:*}"
            ret="${dates##*:}"
            echo "::group::Flight search $dep to $ret"
            set +e
            flyai search-flight \
              --origin "成都" \
              --destination "阿勒泰" \
              --dep-date "$dep" \
              --back-date "$ret" \
              --sort-type 3 \
              >"fare-results/${dep}_${ret}.json" 2>"fare-results/${dep}_${ret}.stderr"
            exit_code=$?
            set -e
            echo "$exit_code" >"fare-results/${dep}_${ret}.exit"
            echo "Query exit code: $exit_code"
            echo "::endgroup::"
          done
      - name: Diagnose FlyAI using control routes
        shell: bash
        run: |
          mkdir -p fare-results
          probe() {
            label="$1"
            origin="$2"
            destination="$3"
            dep="$4"
            set +e
            flyai search-flight --origin "$origin" --destination "$destination" --dep-date "$dep" --sort-type 3 >"fare-results/probe_$label.json" 2>"fare-results/probe_$label.stderr"
            result=$?
            set -e
            echo "$result" >"fare-results/probe_$label.exit"
          }
          probe common Chengdu Beijing 2026-11-10
          probe target Chengdu Altay 2026-12-08
          probe reverse Altay Chengdu 2026-12-13
          probe airport TFU AAT 2026-12-08
          python3 - <<'PY'
          import json, pathlib, os
          lines=["## API diagnostic probes (one way)"]
          for label in ("common","target","reverse","airport"):
            file=pathlib.Path(f"fare-results/probe_{label}.json")
            try:
                data=json.loads(file.read_text(encoding="utf-8"))
                section=data.get("data") if isinstance(data.get("data"),dict) else {}
                items=section.get("itemList") if isinstance(section.get("itemList"),list) else []
                lines.append(f"- {label}: status={data.get('status')}; message={data.get('message')}; items={len(items)}")
                for item in items[:3]:lines.append(f"  - quoted adultPrice={item.get('adultPrice')} (scope and checkout unverified)")
                if data.get("systemMessage"):lines.append(f"  - systemMessage={str(data.get('systemMessage'))[:350]}")
            except Exception as e:
                err=pathlib.Path(f"fare-results/probe_{label}.stderr")
                lines.append(f"- {label}: JSON parse error {type(e).__name__}; stderr={(err.read_text(errors='replace') if err.exists() else '')[:350]}")
          result="\n".join(lines)+"\n"
          print(result)
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:f.write(result)
          PY
      - name: Inspect code-based round trip and return leg
        shell: bash
        run: |
          mkdir -p fare-results
          set +e
          flyai search-flight --origin TFU --destination AAT --dep-date 2026-12-08 --back-date 2026-12-13 --sort-type 3 >fare-results/code-roundtrip.json 2>fare-results/code-roundtrip.stderr
          flyai search-flight --origin AAT --destination TFU --dep-date 2026-12-13 --sort-type 3 >fare-results/code-return.json 2>fare-results/code-return.stderr
          set -e
          python3 - <<'PY'
          import json,pathlib,os
          lines=["## IATA-coded flight responses"]
          for stem in ("probe_airport", "code-roundtrip", "code-return"):
              p=pathlib.Path("fare-results")/(stem+".json")
              try:
                  doc=json.loads(p.read_text(encoding="utf-8"))
                  dat=doc.get("data") if isinstance(doc.get("data"),dict) else {}
                  items=dat.get("itemList") if isinstance(dat.get("itemList"),list) else []
                  lines.append(f"{stem}: status={doc.get('status')} message={doc.get('message')} items={len(items)}")
                  if items:
                      first=items[0]
                      lines.append("keys: "+str(list(first.keys())))
                      lines.append("first_item: "+json.dumps(first,ensure_ascii=False)[:8500])
              except Exception as exc:
                  lines.append(f"{stem}: {type(exc).__name__}: {exc}")
          out="\n".join(lines)+"\n"
          print(out)
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:f.write(out)
          PY
      - name: Show all priced offers and test alternate dates
        shell: bash
        run: |
          mkdir -p fare-results
          for spec in 09:TFU:AAT:2026-12-09 10:TFU:AAT:2026-12-10 r14:AAT:TFU:2026-12-14 r15:AAT:TFU:2026-12-15 rctu:AAT:CTU:2026-12-13 rcn:阿勒泰:成都:2026-12-13; do
            IFS=: read -r tag origin dest date <<< "$spec"
            set +e
            flyai search-flight --origin "$origin" --destination "$dest" --dep-date "$date" --sort-type 3 >"fare-results/extra_$tag.json" 2>"fare-results/extra_$tag.stderr"
            set -e
          done
          python3 - <<'PY'
          import json,pathlib,os
          names=("probe_airport","extra_09","extra_10","extra_r14","extra_r15","extra_rctu","extra_rcn")
          lines=["## All candidate fare details and return alternatives"]
          for name in names:
              p=pathlib.Path("fare-results")/(name+".json")
              try:
                  d=json.loads(p.read_text(encoding="utf-8"))
                  content=d.get("data") if isinstance(d.get("data"),dict) else {}
                  items=content.get("itemList") if isinstance(content.get("itemList"),list) else []
                  lines.append(f"### {name}: API status {d.get('status')}, results {len(items)}, message {d.get('message')}")
                  for offer in items[:12]:
                      routes=[]
                      for journey in offer.get("journeys",[]):
                          segments=journey.get("segments",[])
                          if isinstance(segments,list):
                              routes.append(" / ".join(f"{s.get('depStationCode')}({s.get('depDateTime')}) → {s.get('arrStationCode')}({s.get('arrDateTime')}) {s.get('marketingTransportNo')}" for s in segments))
                      lines.append(f"- ticketPrice={offer.get('ticketPrice')} CNY?; route {' | '.join(routes)}; jumpUrl={offer.get('jumpUrl')}")
              except Exception as e:lines.append(f"### {name}: error {type(e).__name__}")
          summary="\n".join(lines)+"\n"
          print(summary)
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as fh:fh.write(summary)
          PY
      - name: Summarize API responses
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, datetime
          root = pathlib.Path("fare-results")
          lines = [
              "# Chengdu ↔ Altay — FlyAI query results",
              f"Checked (UTC): {datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='minutes')}",
              "Raw API fares are **not confirmed checkout totals**; verify TFU/AAT, both flight legs, taxes, luggage and snow sports equipment.",
              "",
          ]
          for dep, ret in [("2026-12-08", "2026-12-13"), ("2026-12-09", "2026-12-14"), ("2026-12-10", "2026-12-15")]:
              name = f"{dep}_{ret}"
              lines.append(f"## {dep} — {ret}")
              exit_file = root / f"{name}.exit"
              lines.append("Exit code: " + (exit_file.read_text().strip() if exit_file.exists() else "not executed"))
              try:
                  payload = json.loads((root / f"{name}.json").read_text(encoding="utf-8"))
              except Exception as exc:
                  lines.append(f"No parseable API JSON: {type(exc).__name__}")
                  err = root / f"{name}.stderr"
                  if err.exists():
                      lines.append("Error: " + err.read_text(errors="replace")[:600])
                  lines.append("")
                  continue
              lines.append(f"API status: {payload.get('status')}; message: {payload.get('message')}")
              if payload.get("systemMessage"):
                  lines.append("Platform note: " + str(payload["systemMessage"])[:300])
              data = payload.get("data") if isinstance(payload.get("data"), dict) else {}
              flights = data.get("itemList") if isinstance(data.get("itemList"), list) else []
              lines.append(f"Offers: {len(flights)}")
              for item in flights[:8]:
                  routes = []
                  for journey in item.get("journeys", [])[:2]:
                      segs = journey.get("segments", [])
                      if not isinstance(segs, list): continue
                      routes.append(" / ".join(f"{s.get('depStationCode')} {s.get('depDateTime')} → {s.get('arrStationCode')} {s.get('arrDateTime')} {s.get('marketingTransportNo')}" for s in segs))
                  lines.append(f"- Quoted adultPrice: {item.get('adultPrice')}; segments: {' | '.join(routes) or 'unavailable'}")
              if not flights:
                  lines.append("No bookable offers verified — does not imply no flights exist.")
              lines.append("")
          output = "\n".join(lines) + "\n"
          print(output)
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f: f.write(output)
          PY
      - name: Save flight responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altay-flyai-response
          path: fare-results/
          if-no-files-found: ignore
          retention-days: 7

name: Verify published Altay fare dashboard

on:
  push:
    paths:
      - ".github/workflows/verify-altay-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public HTML, sanitized JSON, and blocked public trigger
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          import json, re
          base="https://altay-fare-cron.zoyzhongyin.workers.dev"
          def safe_request(url, *, method=None, data=None):
              return Request(url, method=method, data=data, headers={"User-Agent":"AltayDashboardVerifier/1.0"})
          try:
              homepage=urlopen(safe_request(base+"/"), timeout=20)
          except HTTPError as exc:
              print("Homepage HTTP status:",exc.code)
              print("Server:",exc.headers.get("Server"))
              print("CF-Ray present:",bool(exc.headers.get("CF-Ray")))
              print("Content-Type:",exc.headers.get("Content-Type"))
              print("Response excerpt:",exc.read(250).decode("utf-8","replace"))
              raise
          with homepage as response:
              html=response.read().decode("utf-8")
              assert response.status==200, response.status
              assert "阿勒泰机票监控" in html, "Page not published"
              assert "/api/fares" in html, "Page missing data fetch"
          with urlopen(safe_request(base+"/api/fares"),timeout=20) as response:
              data=json.load(response)
              assert response.status==200
          assert data.get("schema_version")==1
          assert len(data.get("itineraries",[]))==6
          assert len(data.get("windows",[]))==3
          assert data.get("most_recent_check_bjt")
          assert set(data.get("itineraries", [{}])[0])=={
             "departure","return_date","window_id","checked_at_bjt","status",
             "total_cny","outbound_price_cny","return_price_cny",
             "outbound_airline","return_airline","outbound_flight","return_flight","last_valid"}
          assert not any(x in html for x in ("GH_ACTIONS_TOKEN","SERVERCHAN_SENDKEY","FLYAI_API_KEY","CLOUDFLARE_API_TOKEN"))
          assert not any(x in str(data) for x in ("GH_ACTIONS_TOKEN","SERVERCHAN_SENDKEY","FLYAI_API_KEY","CLOUDFLARE_API_TOKEN"))
          try:
              urlopen(safe_request(base+"/", data=b"hi",method="POST"),timeout=20)
              raise AssertionError("Public POST unexpectedly allowed")
          except HTTPError as exc:
              assert exc.code==405, exc.code
          try:
              urlopen(safe_request(base+"/internal/state.json"),timeout=20)
              raise AssertionError("Internal state unexpectedly public")
          except HTTPError as exc:
              assert exc.code==404, exc.code
          print("PASS public 200 HTML")
          print("PASS sanitized JSON: 6 itinerary cards, 3 windows")
          print("PASS blocked POST and private state access")
          print("Published at BJT:",data.get("generated_at_bjt"))
          print("Newest scanned at BJT:",data.get("most_recent_check_bjt"))
          PY
